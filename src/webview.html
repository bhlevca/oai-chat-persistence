<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{NONCE}}';" />
<title>OAI Chat</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--vscode-font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
  font-size: var(--vscode-font-size, 13px);
  background: var(--vscode-editor-background, #1e1e1e);
  color: var(--vscode-editor-foreground, #d4d4d4);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#app {
  display: flex;
  flex: 1;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

/* ── Session bar (replaces sidebar) ─────────────── */

#session-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  border-bottom: 1px solid var(--vscode-panel-border, #3c3c3c);
  background: var(--vscode-sideBar-background, #252526);
  flex-shrink: 0;
}

#session-select {
  flex: 1;
  background: var(--vscode-dropdown-background, #3c3c3c);
  color: var(--vscode-dropdown-foreground, #d4d4d4);
  border: 1px solid var(--vscode-dropdown-border, #555);
  border-radius: 3px;
  padding: 3px 6px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  min-width: 0;
}
#session-select:focus { outline: 1px solid var(--vscode-focusBorder, #007acc); border-color: var(--vscode-focusBorder, #007acc); }

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--vscode-icon-foreground, #c5c5c5);
  padding: 3px 5px;
  border-radius: 3px;
  font-size: 14px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover  { background: var(--vscode-toolbar-hoverBackground, #2a2d2e); }
.icon-btn:active { opacity: 0.75; }

/* ── Main chat area ─────────────────────────────── */

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

#chat-header {
  padding: 5px 8px;
  border-bottom: 1px solid var(--vscode-panel-border, #3c3c3c);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  min-height: 34px;
}

#model-select {
  flex: 1;
  background: var(--vscode-dropdown-background, #3c3c3c);
  color: var(--vscode-dropdown-foreground, #d4d4d4);
  border: 1px solid var(--vscode-dropdown-border, #555);
  border-radius: 3px;
  padding: 2px 5px;
  font-size: 12px;
  cursor: pointer;
  display: none;
  min-width: 0;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 0;
}

/* Welcome / empty state */
#no-session-msg {
  margin: auto;
  text-align: center;
  color: var(--vscode-descriptionForeground, #888);
  line-height: 1.8;
  font-size: 13px;
}
#no-session-msg strong { color: var(--vscode-editor-foreground, #d4d4d4); }

#empty-chat-msg {
  margin: auto;
  text-align: center;
  color: var(--vscode-descriptionForeground, #888);
  font-size: 12px;
  line-height: 1.6;
}

/* Message rows */
.msg-row { display: flex; flex-direction: column; gap: 3px; max-width: 88%; }
.msg-row.user { align-self: flex-end; }
.msg-row.assistant { align-self: flex-start; }
.msg-row.system { align-self: center; max-width: 96%; }

.msg-role {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 4px;
}
.msg-row.user .msg-role     { color: var(--vscode-terminal-ansiCyan,   #4ec9b0); text-align: right; }
.msg-row.assistant .msg-role{ color: var(--vscode-terminal-ansiGreen,  #89d185); }
.msg-row.system .msg-role   { color: var(--vscode-terminal-ansiYellow, #dcdcaa); text-align: center; }

.msg-bubble {
  padding: 8px 12px;
  border-radius: 8px;
  line-height: 1.55;
  font-size: 13px;
  word-break: break-word;
  position: relative;
}
.msg-row.user .msg-bubble {
  background: var(--vscode-button-background, #0e639c);
  color: var(--vscode-button-foreground, #fff);
  border-bottom-right-radius: 2px;
  white-space: pre-wrap;
}
.msg-row.assistant .msg-bubble {
  background: var(--vscode-editorWidget-background, #252526);
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  border-bottom-left-radius: 2px;
}
.msg-row.system .msg-bubble {
  background: transparent;
  border: 1px dashed var(--vscode-panel-border, #3c3c3c);
  font-size: 11px;
  font-style: italic;
  color: var(--vscode-descriptionForeground, #888);
  white-space: pre-wrap;
  border-radius: 4px;
}

/* Markdown inside assistant bubbles */
.msg-bubble pre {
  background: var(--vscode-textCodeBlock-background, #1a1a1a);
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  border-radius: 4px;
  padding: 8px 10px;
  margin: 6px 0;
  overflow-x: auto;
  white-space: pre;
  font-family: var(--vscode-editor-font-family, 'Cascadia Code', 'Consolas', monospace);
  font-size: 12px;
}
.msg-bubble code {
  font-family: var(--vscode-editor-font-family, 'Cascadia Code', 'Consolas', monospace);
  font-size: 12px;
  background: var(--vscode-textCodeBlock-background, #2d2d2d);
  padding: 1px 4px;
  border-radius: 3px;
}
.msg-bubble pre code { background: none; padding: 0; }
.msg-bubble p { margin: 4px 0; }
.msg-bubble p:first-child { margin-top: 0; }
.msg-bubble p:last-child  { margin-bottom: 0; }

/* Copy button */
.msg-copy {
  display: none;
  position: absolute;
  top: 5px;
  right: 5px;
  background: var(--vscode-button-secondaryBackground, #3a3d41);
  color: var(--vscode-button-secondaryForeground, #ccc);
  border: none;
  border-radius: 3px;
  padding: 2px 7px;
  font-size: 10px;
  cursor: pointer;
  white-space: nowrap;
}
.msg-bubble:hover .msg-copy { display: block; }
.msg-copy:hover { background: var(--vscode-button-background, #0e639c); color: #fff; }

/* Compact card */
.compact-card {
  margin: 8px 12px;
  padding: 8px 12px;
  border-radius: 5px;
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  background: var(--vscode-editor-inactiveSelectionBackground, #3a3d41);
  font-size: 11px;
  color: var(--vscode-descriptionForeground, #888);
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.compact-card .compact-icon {
  font-size: 14px;
  flex-shrink: 0;
  user-select: none;
}
.compact-card .compact-body { flex: 1; }
.compact-card .compact-header {
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--vscode-foreground, #ccc);
}
.compact-card .compact-summary {
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.45;
  max-height: 80px;
  overflow: hidden;
  position: relative;
}
.compact-card .compact-summary.expanded { max-height: none; }
.compact-card .compact-toggle {
  background: none;
  border: none;
  color: var(--vscode-textLink-foreground, #3794ff);
  cursor: pointer;
  font-size: 11px;
  padding: 2px 0;
  margin-top: 3px;
}

/* Typing indicator */
#typing-indicator {
  display: none;
  padding: 8px 16px;
  flex-shrink: 0;
}
#typing-indicator.visible {
  display: flex;
  align-items: center;
  gap: 5px;
}
#typing-indicator span {
  font-size: 11px;
  color: var(--vscode-descriptionForeground, #888);
  margin-right: 4px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--vscode-descriptionForeground, #888);
  animation: pulse 1.2s infinite;
}
.dot:nth-child(3) { animation-delay: 0.2s; }
.dot:nth-child(4) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

/* Error banner */
#error-banner {
  display: none;
  margin: 0 12px 6px;
  padding: 7px 10px;
  background: var(--vscode-inputValidation-errorBackground, #5a1d1d);
  color: #f48771;
  border: 1px solid var(--vscode-inputValidation-errorBorder, #be1100);
  border-radius: 4px;
  font-size: 12px;
  flex-shrink: 0;
}
#error-banner.visible { display: block; }

/* ── Input area ──────────────────────────────────── */

#input-area {
  border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex-shrink: 0;
}
#input-area.disabled { opacity: 0.5; pointer-events: none; }

#msg-input {
  width: 100%;
  background: var(--vscode-input-background, #3c3c3c);
  color: var(--vscode-input-foreground, #d4d4d4);
  border: 1px solid var(--vscode-input-border, #555);
  border-radius: 5px;
  padding: 7px 10px;
  font-family: inherit;
  font-size: 13px;
  resize: none;
  min-height: 36px;
  max-height: 150px;
  line-height: 1.45;
  outline: none;
}
#msg-input:focus { border-color: var(--vscode-focusBorder, #007acc); }
#msg-input::placeholder { color: var(--vscode-input-placeholderForeground, #666); }

#input-actions { display: flex; align-items: center; gap: 6px; }
.spacer { flex: 1; }

/* Buttons */
.btn {
  background: var(--vscode-button-background, #0e639c);
  color: var(--vscode-button-foreground, #fff);
  border: none;
  border-radius: 3px;
  padding: 5px 11px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover    { background: var(--vscode-button-hoverBackground, #1177bb); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.secondary {
  background: var(--vscode-button-secondaryBackground, #3a3d41);
  color: var(--vscode-button-secondaryForeground, #ccc);
}
.btn.secondary:hover { background: var(--vscode-button-secondaryHoverBackground, #45494e); }
.btn.danger { background: #5a1d1d; color: #f48771; }
.btn.danger:hover { background: #6e2020; }

/* ── Modals ──────────────────────────────────────── */

.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 50;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--vscode-editorWidget-background, #252526);
  border: 1px solid var(--vscode-panel-border, #555);
  border-radius: 6px;
  padding: 18px 20px;
  width: 360px;
  max-width: 92vw;
  display: flex;
  flex-direction: column;
  gap: 11px;
}
.modal h3 { font-size: 13px; font-weight: 700; }

.modal input,
.modal select,
.modal textarea {
  width: 100%;
  background: var(--vscode-input-background, #3c3c3c);
  color: var(--vscode-input-foreground, #d4d4d4);
  border: 1px solid var(--vscode-input-border, #555);
  border-radius: 3px;
  padding: 6px 8px;
  font-family: inherit;
  font-size: 13px;
  outline: none;
}
.modal input:focus,
.modal select:focus,
.modal textarea:focus { border-color: var(--vscode-focusBorder, #007acc); }
.modal textarea { min-height: 90px; resize: vertical; }

.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 2px; }

/* ── Scrollbar ───────────────────────────────────── */

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--vscode-scrollbarSlider-background, #424242);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--vscode-scrollbarSlider-hoverBackground, #555);
}

/* Streaming cursor blink */
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
.cursor { animation: blink 0.7s step-end infinite; font-weight: bold; }

/* ── Agent toggle ─────────────────────────────────── */
#btn-agent {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 10px;
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  white-space: nowrap;
}
#btn-agent.agent {
  border-color: var(--vscode-charts-green, #89d185);
  color: var(--vscode-charts-green, #89d185);
}
#btn-agent.readonly {
  border-color: var(--vscode-descriptionForeground, #888);
  color: var(--vscode-descriptionForeground, #888);
}

/* ── Code block with actions ──────────────────────── */
.code-wrap {
  margin: 7px 0;
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  border-radius: 4px;
  overflow: hidden;
}
.code-head {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 3px 5px;
  background: var(--vscode-editorGroupHeader-tabsBackground, #2d2d2d);
  border-bottom: 1px solid var(--vscode-panel-border, #3c3c3c);
}
.code-path {
  flex: 1;
  min-width: 0;
  font-family: var(--vscode-editor-font-family, monospace);
  font-size: 10px;
  color: var(--vscode-descriptionForeground, #888);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.code-btn {
  background: var(--vscode-button-secondaryBackground, #3a3d41);
  color: var(--vscode-button-secondaryForeground, #ccc);
  border: none;
  border-radius: 3px;
  padding: 2px 6px;
  font-size: 10px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.code-btn:hover { background: var(--vscode-button-background, #0e639c); color: #fff; }
.code-btn.primary {
  background: var(--vscode-button-background, #0e639c);
  color: var(--vscode-button-foreground, #fff);
}
.code-wrap pre { margin: 0; border: none; border-radius: 0; }

/* ── Tool activity card ───────────────────────────── */
.tool-card {
  align-self: stretch;
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  border-radius: 4px;
  background: var(--vscode-editorWidget-background, #252526);
  font-size: 11px;
  overflow: hidden;
}
.tool-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  cursor: pointer;
  user-select: none;
}
.tool-head:hover { background: var(--vscode-toolbar-hoverBackground, #2a2d2e); }
.tool-icon { flex-shrink: 0; font-size: 11px; }
.tool-label {
  flex: 1;
  min-width: 0;
  font-family: var(--vscode-editor-font-family, monospace);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--vscode-foreground, #ccc);
}
.tool-status { font-size: 10px; color: var(--vscode-descriptionForeground, #888); }
.tool-card.failed .tool-status { color: #f48771; }
.tool-result {
  display: none;
  padding: 6px 8px;
  border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
  background: var(--vscode-textCodeBlock-background, #1a1a1a);
  font-family: var(--vscode-editor-font-family, monospace);
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 220px;
  overflow: auto;
}
.tool-card.open .tool-result { display: block; }
.tool-spin { animation: spin 1.1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Approval card ────────────────────────────────── */
.approval-card {
  align-self: stretch;
  border: 1px solid var(--vscode-inputValidation-warningBorder, #b89500);
  border-radius: 5px;
  background: var(--vscode-editorWidget-background, #252526);
  overflow: hidden;
}
.approval-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  font-size: 12px;
  font-weight: 600;
  background: var(--vscode-inputValidation-warningBackground, #352a05);
}
.approval-title { flex: 1; min-width: 0; word-break: break-word; }
.approval-stats { font-size: 10px; font-weight: 400; white-space: nowrap; }
.approval-detail {
  padding: 4px 9px;
  font-size: 11px;
  color: var(--vscode-descriptionForeground, #888);
}
.approval-diff {
  margin: 0;
  padding: 6px 9px;
  background: var(--vscode-textCodeBlock-background, #1a1a1a);
  font-family: var(--vscode-editor-font-family, monospace);
  font-size: 11px;
  line-height: 1.4;
  white-space: pre;
  overflow: auto;
  max-height: 240px;
  border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
}
.approval-actions {
  display: flex;
  gap: 6px;
  padding: 7px 9px;
  border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
  flex-wrap: wrap;
}
.approval-card.resolved .approval-actions { display: none; }
.approval-outcome {
  display: none;
  padding: 6px 9px;
  font-size: 11px;
  border-top: 1px solid var(--vscode-panel-border, #3c3c3c);
}
.approval-card.resolved .approval-outcome { display: block; }
.diff-add { color: var(--vscode-gitDecoration-addedResourceForeground, #81b88b); }
.diff-del { color: var(--vscode-gitDecoration-deletedResourceForeground, #c74e39); }
.diff-meta { color: var(--vscode-descriptionForeground, #888); }

/* ── Notices / action results ─────────────────────── */
.notice {
  align-self: stretch;
  padding: 5px 9px;
  border-radius: 4px;
  border: 1px dashed var(--vscode-panel-border, #3c3c3c);
  font-size: 11px;
  color: var(--vscode-descriptionForeground, #888);
}
.notice.error { color: #f48771; border-color: var(--vscode-inputValidation-errorBorder, #be1100); }

/* ── Context strip ────────────────────────────────── */
#context-strip {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}
.chip {
  background: none;
  border: 1px solid var(--vscode-panel-border, #3c3c3c);
  border-radius: 10px;
  color: var(--vscode-descriptionForeground, #888);
  font-family: inherit;
  font-size: 10px;
  padding: 1px 7px;
  cursor: pointer;
  white-space: nowrap;
}
.chip:hover { background: var(--vscode-toolbar-hoverBackground, #2a2d2e); color: var(--vscode-foreground, #ccc); }
#chip-context {
  cursor: default;
  border-style: dashed;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: right;
}
#chip-context:hover { background: none; color: var(--vscode-descriptionForeground, #888); }
</style>
</head>
<body>
<div id="app">

  <!-- ── Session bar ── -->
  <div id="session-bar">
    <select id="session-select" title="Switch session">
      <option value="">— no session —</option>
    </select>
    <button class="icon-btn" id="btn-new"           title="New session">＋</button>
    <button class="icon-btn" id="btn-refresh-models" title="Refresh model list">⟳</button>
  </div>

  <!-- ── Main ── -->
  <div id="main">

    <div id="chat-header">
      <select id="model-select" title="Active model"></select>
      <button class="icon-btn" id="btn-agent" title="Toggle agent mode (model may edit files)" style="display:none">🛠 agent</button>
      <button class="icon-btn" id="btn-compact"    title="Compact context now"   style="display:none">⬡</button>
      <button class="icon-btn" id="btn-sys-prompt" title="Set system prompt"     style="display:none">⚙</button>
      <button class="icon-btn" id="btn-export"     title="Export as JSON"        style="display:none">↓</button>
      <button class="icon-btn" id="btn-clear"      title="Clear all messages"    style="display:none">🗑</button>
      <button class="icon-btn" id="btn-del-session" title="Delete this session"  style="display:none;color:var(--vscode-errorForeground)">✕ del</button>
    </div>

    <div id="messages">
      <div id="no-session-msg">
        <strong>OAI Chat</strong><br/>
        Click <strong>＋</strong> above to start a new session.<br/>
        <div id="landing-models" style="margin-top:14px"></div>
      </div>
    </div>

    <div id="typing-indicator">
      <span>Thinking…</span>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div id="error-banner"></div>

    <div id="input-area" class="disabled">
      <div id="context-strip">
        <button class="chip" id="chip-pick"      title="Pick a workspace file to attach">📎 file</button>
        <button class="chip" id="chip-active"    title="Attach the whole active file">@active</button>
        <button class="chip" id="chip-selection" title="Attach the current editor selection">@selection</button>
        <button class="chip" id="chip-problems"  title="Attach errors and warnings">@problems</button>
        <span class="chip" id="chip-context">no editor</span>
      </div>
      <textarea id="msg-input"
        placeholder="Message… (Enter↵ send, Shift+Enter newline) — @active @selection @problems @path/file @find:*.js @search:myFunc"
        rows="1"></textarea>
      <div id="input-actions">
        <button class="btn danger" id="btn-stop" style="display:none">■ Stop</button>
        <div class="spacer"></div>
        <button class="btn" id="btn-send" disabled>Send</button>
      </div>
    </div>

  </div>
</div>

<!-- ── New Session Modal ── -->
<div class="modal-overlay" id="modal-new">
  <div class="modal">
    <h3>New Chat Session</h3>
    <input type="text" id="new-name"
           placeholder="Session name (e.g. trading-ideas)"
           maxlength="64" autocomplete="off" />
    <select id="new-model">
      <option value="">— select model —</option>
    </select>
    <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--vscode-descriptionForeground,#888)">
      <input type="checkbox" id="new-agent" checked style="width:auto" />
      Agent mode — may edit workspace files (you approve each diff)
    </label>
    <div class="modal-actions">
      <button class="btn secondary" id="new-cancel">Cancel</button>
      <button class="btn" id="new-create">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-sys">
  <div class="modal">
    <h3>System Prompt</h3>
    <textarea id="sys-content"
      placeholder="You are a helpful assistant…"></textarea>
    <div class="modal-actions">
      <button class="btn secondary" id="sys-cancel">Cancel</button>
      <button class="btn" id="sys-save">Save</button>
    </div>
  </div>
</div>

<script nonce="{{NONCE}}">
'use strict';

const vscode = acquireVsCodeApi();

// ── State ─────────────────────────────────────────────────────────────────────

const state = {
  sessions: [],    // [{ name, model, agent, messageCount, updated }]
  models:   [],    // [{ id, label, vendor, family }]
  session:  null,  // currently loaded full session object
  streaming: false,
  streamBuffer: '',
  capabilities: { writeTools: true, terminalTool: false, autoApprove: false, defaultAgent: true, hasWorkspace: true },
  editorContext: null,
};

// ── DOM refs ──────────────────────────────────────────────────────────────────

const $  = (id) => document.getElementById(id);
const sessionSelect  = $('session-select');
const btnDelSession  = $('btn-del-session');
const messages       = $('messages');
const modelSelect    = $('model-select');
const msgInput       = $('msg-input');
const btnSend        = $('btn-send');
const btnStop        = $('btn-stop');
const inputArea      = $('input-area');
const typingIndicator= $('typing-indicator');
const errorBanner    = $('error-banner');
const btnCompact     = $('btn-compact');
const btnSysPrompt   = $('btn-sys-prompt');
const btnExport      = $('btn-export');
const btnClear       = $('btn-clear');
const btnAgent       = $('btn-agent');
const chipContext    = $('chip-context');

// ── Bootstrap ─────────────────────────────────────────────────────────────────

vscode.postMessage({ type: 'init' });

// ── Message handler (extension → webview) ─────────────────────────────────────

window.addEventListener('message', ({ data: msg }) => {
  switch (msg.type) {

    case 'init':
      state.sessions = msg.sessions;
      state.models   = msg.models;
      if (msg.capabilities) state.capabilities = msg.capabilities;
      if (msg.context) updateContextChip(msg.context);
      populateSessionDropdown();
      populateModelDropdowns();
      renderAgentToggle();
      break;

    case 'editorContext':
      updateContextChip(msg.context);
      break;

    case 'insertIntoInput':
      insertIntoInput(msg.text, msg.autoSend);
      break;

    case 'toolStart':
      startToolCard(msg);
      break;

    case 'toolEnd':
      finishToolCard(msg);
      break;

    case 'toolApproval':
      appendApprovalCard(msg.id, msg.req);
      break;

    case 'toolApprovalAuto':
      appendNotice(`Applied automatically: ${msg.req.title}`);
      break;

    case 'approvalClosed':
      resolveApprovalCard(msg.id, msg.approved, 'cancelled');
      break;

    case 'notice':
      appendNotice(msg.text);
      break;

    case 'actionResult':
      appendNotice(msg.text, msg.error);
      break;

    case 'sessions':
      state.sessions = msg.sessions;
      populateSessionDropdown();
      break;

    case 'models':
      state.models = msg.models;
      populateModelDropdowns();
      break;

    case 'sessionLoaded':
      state.session = msg.session;
      state._pendingUserContent = null;  // re-render from storage — no duplicate needed
      renderChat();
      renderAgentToggle();
      break;

    case 'compacting':
      // Context compaction is running — lock UI, show indicator
      state.streaming = true;
      typingIndicator.querySelector('span').textContent = 'Compacting context…';
      typingIndicator.classList.add('visible');
      btnStop.style.display = 'inline-block';
      btnSend.style.display = 'none';
      inputArea.classList.add('disabled');
      hideError();
      break;

    case 'compactDone':
      // Reset label; if compaction failed show a warning
      typingIndicator.querySelector('span').textContent = 'Thinking…';
      if (!msg.success) {
        state.streaming = false;
        typingIndicator.classList.remove('visible');
        btnStop.style.display = 'none';
        btnSend.style.display = 'inline-block';
        inputArea.classList.remove('disabled');
        showError('Context compaction failed — continuing without it.');
      }
      break;

    case 'streamStart':
      state.streaming    = true;
      state.streamBuffer = '';
      typingIndicator.querySelector('span').textContent = 'Thinking…';
      typingIndicator.classList.add('visible');
      btnStop.style.display = 'inline-block';
      btnSend.style.display = 'none';
      inputArea.classList.add('disabled');
      hideError();
      appendStreamBubble();
      break;

    case 'chunk':
      state.streamBuffer += msg.content;
      updateStreamBubble(state.streamBuffer);
      break;

    case 'streamEnd':
      state.streaming = false;
      typingIndicator.classList.remove('visible');
      btnStop.style.display = 'none';
      btnSend.style.display = 'inline-block';
      inputArea.classList.remove('disabled');
      if (state.streamBuffer && state.streamBuffer.trim()) {
        finalizeStreamBubble(state.streamBuffer);
      } else {
        // No content — remove the ghost bubble so it doesn't disrupt order
        if (streamRow) { streamRow.remove(); streamRow = null; }
      }
      // Update local session state so re-renders stay correct
      if (state.session && msg.assistantContent && !msg.aborted) {
        state.session.messages.push({
          role: 'assistant',
          content: msg.assistantContent,
          timestamp: new Date().toISOString(),
        });
      }
      abandonPendingToolCards();
      if (msg.error) showError('Error: ' + msg.error);
      if (msg.aborted && !msg.error && !msg.assistantContent) {
        // streamEnd after manual compact-only — no error to show
        hideError();
      }
      break;
  }
});

// ── Session dropdown ──────────────────────────────────────────────────────────

function populateSessionDropdown() {
  const cur = state.session?.name || sessionSelect.value;
  sessionSelect.innerHTML = '<option value="">\u2014 select or create session \u2014</option>';
  for (const s of state.sessions) {
    const o = document.createElement('option');
    o.value = s.name;
    o.textContent = s.name;
    sessionSelect.appendChild(o);
  }
  sessionSelect.value = cur;
}

// ── Render chat area ──────────────────────────────────────────────────────────

function renderChat() {
  const s = state.session;
  if (!s) return;

  // Keep session dropdown in sync
  sessionSelect.value = s.name;
  btnDelSession.style.display = 'inline-flex';

  modelSelect.style.display = 'block';
  modelSelect.value = s.model || '';
  // If stored model isn't in list, add placeholder
  if (s.model && !modelSelect.value) {
    const o = document.createElement('option');
    o.value = s.model;
    o.textContent = s.model + ' (not found — refresh ⟳)';
    modelSelect.prepend(o);
    modelSelect.value = s.model;
  }
  btnCompact.style.display   = 'inline-flex';
  btnSysPrompt.style.display = 'inline-flex';
  btnExport.style.display    = 'inline-flex';
  btnClear.style.display     = 'inline-flex';
  inputArea.classList.remove('disabled');
  btnSend.disabled = !s.model;

  messages.innerHTML = '';

  if (!s.messages.length) {
    const div = document.createElement('div');
    div.id = 'empty-chat-msg';
    div.innerHTML = 'No messages yet.<br/>Type below to start chatting.';
    messages.appendChild(div);
    return;
  }

  for (const m of s.messages) {
    if (m._tool) {
      appendToolCard({ label: m.label || m.name, ok: m.ok !== false, result: m.content });
      continue;
    }
    appendMsg(m.role, m.content, { compact: !!m._compact, compactedCount: m.compactedCount });
  }
  scrollBottom();
}

function clearActiveSession() {
  state.session = null;
  sessionSelect.value    = '';
  btnDelSession.style.display = 'none';
  modelSelect.style.display   = 'none';
  btnCompact.style.display    = 'none';
  btnSysPrompt.style.display  = 'none';
  btnExport.style.display     = 'none';
  btnClear.style.display      = 'none';
  btnAgent.style.display      = 'none';
  inputArea.classList.add('disabled');
  btnSend.disabled = true;
  messages.innerHTML = '';
  const div = document.createElement('div');
  div.id = 'no-session-msg';
  div.innerHTML = '<strong>OAI Chat</strong><br/>Click <strong>＋</strong> above to start a new session.<br/><div id="landing-models" style="margin-top:14px"></div>';
  messages.appendChild(div);
  updateLandingModels();
}

// ── Message rendering ─────────────────────────────────────────────────────────

function appendMsg(role, content, opts = {}) {
  // Compact summaries get a dedicated card instead of a normal bubble
  if (opts.compact) {
    appendCompactCard(content, opts.compactedCount);
    return;
  }

  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-role';
  label.textContent = role;

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  // Only render markdown for assistant; user/system are plain pre-wrapped
  bubble.innerHTML = (role === 'assistant') ? renderMarkdown(content) : plainText(content);
  if (role === 'assistant') decorateCodeBlocks(bubble);

  const copy = document.createElement('button');
  copy.className = 'msg-copy';
  copy.textContent = 'copy';
  copy.addEventListener('click', () => {
    navigator.clipboard.writeText(content).then(() => {
      copy.textContent = 'copied!';
      setTimeout(() => (copy.textContent = 'copy'), 1500);
    }).catch(() => {});
  });
  bubble.appendChild(copy);

  row.appendChild(label);
  row.appendChild(bubble);
  messages.appendChild(row);
}

function appendCompactCard(summary, compactedCount) {
  const card = document.createElement('div');
  card.className = 'compact-card';

  const countLabel = compactedCount ? ` (${compactedCount} messages)` : '';
  card.innerHTML = `
    <div class="compact-icon">⨁</div>
    <div class="compact-body">
      <div class="compact-header">Context compacted${countLabel}</div>
      <div class="compact-summary">${plainText(summary)}</div>
      <button class="compact-toggle">show more</button>
    </div>`;

  const summaryEl = card.querySelector('.compact-summary');
  const toggle    = card.querySelector('.compact-toggle');
  toggle.addEventListener('click', () => {
    const expanded = summaryEl.classList.toggle('expanded');
    toggle.textContent = expanded ? 'show less' : 'show more';
  });

  messages.appendChild(card);
}

// ── Streaming bubble ──────────────────────────────────────────────────────────

let streamRow = null;

function appendStreamBubble() {
  if (streamRow) streamRow.remove();
  streamRow = document.createElement('div');
  streamRow.className = 'msg-row assistant';

  const label = document.createElement('div');
  label.className = 'msg-role';
  label.textContent = 'assistant';

  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.id = 'stream-bubble';

  streamRow.appendChild(label);
  streamRow.appendChild(bubble);
  messages.appendChild(streamRow);
  scrollBottom();
}

function updateStreamBubble(content) {
  const b = $('stream-bubble');
  if (b) {
    b.innerHTML = renderMarkdown(content, { withActions: false }) + '<span class="cursor">▋</span>';
    scrollBottom();
  }
}

function finalizeStreamBubble(content) {
  const b = $('stream-bubble');
  if (b) {
    b.removeAttribute('id');   // free the id so the next stream gets a clean element
    b.innerHTML = renderMarkdown(content);
    decorateCodeBlocks(b);
    const copy = document.createElement('button');
    copy.className = 'msg-copy';
    copy.textContent = 'copy';
    copy.addEventListener('click', () => {
      navigator.clipboard.writeText(content).then(() => {
        copy.textContent = 'copied!';
        setTimeout(() => (copy.textContent = 'copy'), 1500);
      }).catch(() => {});
    });
    b.appendChild(copy);
  }
  streamRow = null;
  scrollBottom();
}

// ── Markdown renderer ─────────────────────────────────────────────────────────

// Code blocks are kept in a registry so their exact text can be handed back to
// the extension (apply / insert / diff) without round-tripping through HTML.
let cbSeq = 0;
const codeBlocks = new Map();

function renderMarkdown(text, { withActions = true } = {}) {
  let html = '';
  const fenceRe = /```([^\n]*)\n?([\s\S]*?)```/g;
  let last = 0;
  let m;
  while ((m = fenceRe.exec(text)) !== null) {
    html += inlineMd(esc(text.slice(last, m.index)));
    html += renderCodeBlock(m[1] || '', m[2] || '', withActions);
    last = fenceRe.lastIndex;
  }
  html += inlineMd(esc(text.slice(last)));
  return html;
}

/** Split a fence info string into a language and a file path hint. */
function parseFenceInfo(info) {
  const parts = String(info).trim().split(/[\s,]+/).filter(Boolean);
  let lang = '', filePath = '';
  for (const raw of parts) {
    const part = raw.replace(/^[("'\[]+|[)"'\]]+$/g, '').replace(/^(?:file|path|filename)[:=]/i, '');
    const looksLikePath = /[\/\\]/.test(part) || /\.[A-Za-z0-9]{1,8}$/.test(part);
    if (looksLikePath && !filePath) filePath = part;
    else if (!lang) lang = part;
  }
  if (filePath && !lang) {
    const ext = filePath.split('.').pop();
    if (ext && ext !== filePath) lang = ext;
  }
  return { lang, path: filePath };
}

function renderCodeBlock(info, code, withActions) {
  let { lang, path: filePath } = parseFenceInfo(info);
  let body = code;

  // @-injections (and many models) open the block with a "# File: path" line.
  const firstLine = body.split('\n')[0] || '';
  const hinted = firstLine.match(/^\s*(?:#|\/\/|--|<!--|;)\s*(?:File|Filename|Path)\s*:\s*(.+?)\s*(?:-->)?\s*$/i);
  if (hinted) {
    if (!filePath) filePath = hinted[1].trim();
    body = body.slice(firstLine.length + 1);
  }
  body = body.replace(/\n$/, '');

  const pre = `<pre><code class="language-${esc(lang)}">${esc(body)}</code></pre>`;
  if (!withActions || !body.trim()) return pre;

  const id = 'cb' + (++cbSeq);
  codeBlocks.set(id, { code: body, path: filePath, lang });
  if (codeBlocks.size > 400) codeBlocks.delete(codeBlocks.keys().next().value);

  return `<div class="code-wrap" data-cb="${id}">` +
    `<div class="code-head"><span class="code-path">${esc(filePath || lang || 'code')}</span></div>` +
    pre + '</div>';
}

/** Add the action toolbar to every freshly rendered code block. */
function decorateCodeBlocks(container) {
  container.querySelectorAll('.code-wrap[data-cb]').forEach((wrap) => {
    if (wrap.dataset.decorated) return;
    wrap.dataset.decorated = '1';
    const entry = codeBlocks.get(wrap.dataset.cb);
    if (!entry) return;
    const head = wrap.querySelector('.code-head');

    const add = (text, title, handler, primary) => {
      const b = document.createElement('button');
      b.className = 'code-btn' + (primary ? ' primary' : '');
      b.textContent = text;
      b.title = title;
      b.addEventListener('click', () => handler(b));
      head.appendChild(b);
      return b;
    };

    add('copy', 'Copy to clipboard', (b) => {
      navigator.clipboard.writeText(entry.code).then(() => {
        b.textContent = 'copied';
        setTimeout(() => (b.textContent = 'copy'), 1400);
      }).catch(() => {});
    });

    if (state.capabilities.hasWorkspace) {
      add('apply', entry.path
        ? `Replace ${entry.path} with this block (diff first)`
        : 'Replace the active editor file with this block (diff first)',
        () => post('applyBlock', { code: entry.code, path: entry.path }), true);
      add('insert', 'Insert at the cursor in the active editor',
        () => post('insertBlock', { code: entry.code }));
      add('new', 'Save this block as a new file',
        () => post('newFileFromBlock', { code: entry.code, path: entry.path }));
      add('diff', 'Open a diff against the target file',
        () => post('diffBlock', { code: entry.code, path: entry.path }));
    }
  });
}

function inlineMd(s) {
  // inline code
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  // bold
  s = s.replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>');
  s = s.replace(/__(.+?)__/gs,     '<strong>$1</strong>');
  // italic
  s = s.replace(/\*([^*\n]+)\*/g,  '<em>$1</em>');
  s = s.replace(/_([^_\n]+)_/g,    '<em>$1</em>');
  // line breaks
  s = s.replace(/\n/g, '<br/>');
  return s;
}

function plainText(text) {
  return esc(text).replace(/\n/g, '<br/>');
}

function esc(str) {
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#39;');
}

// ── Tool activity cards ───────────────────────────────────────────────────────

const liveToolCards = new Map();   // call id -> card element

function appendToolCard({ id, label, ok, result, pending }) {
  const card = document.createElement('div');
  card.className = 'tool-card' + (pending ? ' pending' : (ok ? '' : ' failed'));

  const head = document.createElement('div');
  head.className = 'tool-head';
  head.innerHTML =
    `<span class="tool-icon">${pending ? '<span class="tool-spin">◐</span>' : ok ? '✓' : '✕'}</span>` +
    `<span class="tool-label">${esc(label || 'tool')}</span>` +
    `<span class="tool-status">${pending ? 'running…' : ok ? 'done' : 'failed'}</span>`;

  const body = document.createElement('div');
  body.className = 'tool-result';
  body.textContent = result || '';

  head.addEventListener('click', () => {
    if (!body.textContent) return;
    card.classList.toggle('open');
  });

  card.appendChild(head);
  card.appendChild(body);
  messages.appendChild(card);
  scrollBottom();
  if (id) liveToolCards.set(id, card);
  return card;
}

function startToolCard(msg) {
  appendToolCard({ id: msg.id, label: msg.label, pending: true });
}

function finishToolCard(msg) {
  const card = liveToolCards.get(msg.id);
  if (!card) {
    appendToolCard({ label: msg.label, ok: msg.ok, result: msg.result });
    return;
  }
  liveToolCards.delete(msg.id);
  card.classList.remove('pending');
  if (!msg.ok) card.classList.add('failed');
  const icon   = card.querySelector('.tool-icon');
  const status = card.querySelector('.tool-status');
  const body   = card.querySelector('.tool-result');
  icon.innerHTML = msg.ok ? '✓' : '✕';
  status.textContent = msg.ok ? 'done' : 'failed';
  body.textContent = msg.result || '';
  scrollBottom();
}

/** A cancelled or failed turn can leave spinners behind. */
function abandonPendingToolCards() {
  for (const [id, card] of liveToolCards) {
    liveToolCards.delete(id);
    card.classList.remove('pending');
    card.querySelector('.tool-icon').innerHTML = '–';
    card.querySelector('.tool-status').textContent = 'stopped';
  }
}

// ── Approval cards ────────────────────────────────────────────────────────────

const approvalCards = new Map();   // approval id -> card element

function renderDiffHtml(diff) {
  return diff.split('\n').map((line) => {
    const cls = line.startsWith('+++') || line.startsWith('---') || line.startsWith('@@')
      ? 'diff-meta'
      : line.startsWith('+') ? 'diff-add'
      : line.startsWith('-') ? 'diff-del'
      : '';
    return cls ? `<span class="${cls}">${esc(line)}</span>` : esc(line);
  }).join('\n');
}

function appendApprovalCard(id, req) {
  const card = document.createElement('div');
  card.className = 'approval-card';

  const stats = req.stats ? `+${req.stats.added}/-${req.stats.removed}` : '';
  const icon  = req.kind === 'delete' ? '🗑' : req.kind === 'shell' ? '▶' : '✎';

  const head = document.createElement('div');
  head.className = 'approval-head';
  head.innerHTML =
    `<span>${icon}</span><span class="approval-title">${esc(req.title)}</span>` +
    `<span class="approval-stats">${esc(stats)}</span>`;
  card.appendChild(head);

  if (req.detail) {
    const d = document.createElement('div');
    d.className = 'approval-detail';
    d.textContent = req.detail;
    card.appendChild(d);
  }

  if (req.kind === 'shell') {
    const pre = document.createElement('pre');
    pre.className = 'approval-diff';
    pre.textContent = '$ ' + req.command;
    card.appendChild(pre);
  } else if (req.diff) {
    const pre = document.createElement('pre');
    pre.className = 'approval-diff';
    pre.innerHTML = renderDiffHtml(req.diff);
    card.appendChild(pre);
  }

  const actions = document.createElement('div');
  actions.className = 'approval-actions';

  const mkBtn = (text, cls, handler) => {
    const b = document.createElement('button');
    b.className = 'btn ' + cls;
    b.textContent = text;
    b.addEventListener('click', handler);
    actions.appendChild(b);
    return b;
  };

  mkBtn(req.kind === 'shell' ? 'Run' : req.kind === 'delete' ? 'Delete' : 'Apply', '', () => {
    post('approvalResponse', { id, approved: true, applyAll: false });
    resolveApprovalCard(id, true);
  });
  mkBtn('Reject', 'danger', () => {
    post('approvalResponse', { id, approved: false });
    resolveApprovalCard(id, false);
  });
  if (req.canDiff) {
    mkBtn('Open diff', 'secondary', () => post('showApprovalDiff', { id }));
  }
  if (req.canApplyAll) {
    mkBtn('Apply all', 'secondary', () => {
      post('approvalResponse', { id, approved: true, applyAll: true });
      resolveApprovalCard(id, true, 'applied — further changes in this reply are auto-applied');
    });
  }
  card.appendChild(actions);

  const outcome = document.createElement('div');
  outcome.className = 'approval-outcome';
  card.appendChild(outcome);

  messages.appendChild(card);
  approvalCards.set(id, card);
  scrollBottom();
}

function resolveApprovalCard(id, approved, note) {
  const card = approvalCards.get(id);
  if (!card) return;
  approvalCards.delete(id);
  card.classList.add('resolved');
  const outcome = card.querySelector('.approval-outcome');
  outcome.textContent = note || (approved ? 'applied' : 'rejected');
  outcome.style.color = approved
    ? 'var(--vscode-charts-green, #89d185)'
    : 'var(--vscode-descriptionForeground, #888)';
}

// ── Notices ───────────────────────────────────────────────────────────────────

function appendNotice(text, isError) {
  const el = document.createElement('div');
  el.className = 'notice' + (isError ? ' error' : '');
  el.textContent = text;
  messages.appendChild(el);
  scrollBottom();
}

// ── Workspace context strip ───────────────────────────────────────────────────

function updateContextChip(ctx) {
  state.editorContext = ctx || null;
  if (!ctx || !ctx.file) {
    chipContext.textContent = 'no active editor';
    chipContext.title = '';
    return;
  }
  const sel = ctx.selection
    ? ` · sel ${ctx.selection.startLine}-${ctx.selection.endLine}`
    : ` · line ${ctx.cursorLine}`;
  chipContext.textContent = ctx.file.split(/[\\/]/).pop() + sel;
  chipContext.title = ctx.file + sel;
}

function insertIntoInput(text, autoSend) {
  const cur = msgInput.value;
  msgInput.value = cur && !/\s$/.test(cur) ? `${cur} ${text}` : cur + text;
  msgInput.focus();
  autoResize();
  if (autoSend) sendMessage();
}

// ── Agent-mode toggle ─────────────────────────────────────────────────────────

function renderAgentToggle() {
  if (!state.session || !state.capabilities.writeTools) {
    btnAgent.style.display = 'none';
    return;
  }
  const agent = state.session.agent !== false;
  btnAgent.style.display = 'inline-flex';
  btnAgent.className = 'icon-btn ' + (agent ? 'agent' : 'readonly');
  btnAgent.textContent = agent ? '🛠 agent' : '👁 read-only';
  btnAgent.title = agent
    ? 'Agent mode: the model may edit workspace files (each change needs your approval). Click for read-only.'
    : 'Read-only mode: the model can only read the workspace. Click to allow edits.';
}

// ── Model dropdown helpers ────────────────────────────────────────────────────

function populateModelDropdowns() {
  // Main header select
  const cur = modelSelect.value;
  modelSelect.innerHTML = '';

  if (!state.models.length) {
    const o = document.createElement('option');
    o.value = '';
    o.textContent = 'No models — install GitHub Copilot or a VS Code LM extension';
    modelSelect.appendChild(o);
  } else {
    // Leading blank so users must actively pick a model
    const blank = document.createElement('option');
    blank.value = '';
    blank.textContent = '— select model —';
    modelSelect.appendChild(blank);

    for (const m of state.models) {
      const o = document.createElement('option');
      o.value = m.id;
      o.textContent = m.label + (m.vendor ? ` (${m.vendor})` : '');
      modelSelect.appendChild(o);
    }
  }
  modelSelect.value = cur;

  // New-session modal select
  const newModel = $('new-model');
  const curNew = newModel.value;
  newModel.innerHTML = '<option value="">— select model —</option>';
  for (const m of state.models) {
    const o = document.createElement('option');
    o.value = m.id;
    o.textContent = m.label + (m.vendor ? ` (${m.vendor})` : '');
    newModel.appendChild(o);
  }
  newModel.value = curNew;

  // Update landing page model list if no session is active
  if (!state.session) updateLandingModels();
}

function updateLandingModels() {
  const el = $('landing-models');
  if (!el) return;
  if (!state.models.length) {
    el.innerHTML = '<span style="font-size:11px;color:var(--vscode-descriptionForeground,#888)">No models found — install the <strong>GitHub Copilot</strong> extension and sign in.</span>';
    return;
  }
  el.innerHTML = '<div style="font-size:11px;color:var(--vscode-descriptionForeground,#888);margin-bottom:6px">Available models:</div>' +
    state.models.map(m =>
      `<div style="font-size:12px;padding:3px 8px;margin:2px 0;border-radius:3px;background:var(--vscode-editor-inactiveSelectionBackground,#3a3d41);color:var(--vscode-foreground,#ccc)">${m.label}${m.vendor ? ` <span style="opacity:.6">(${m.vendor})</span>` : ''}</div>`
    ).join('');
}

// ── Sending a message ─────────────────────────────────────────────────────────

function sendMessage() {
  if (state.streaming) return;
  if (!state.session) {
    showError('Create or select a session first (＋ above).');
    return;
  }
  const content = msgInput.value.trim();
  if (!content) return;

  const modelId = modelSelect.value;
  if (!modelId) {
    showError('Select a model before sending.');
    return;
  }

  msgInput.value = '';
  autoResize();

  // Add user bubble immediately for responsiveness, and track it so we can
  // remove it if sessionLoaded (compaction) re-renders the whole chat.
  appendMsg('user', content);
  state._pendingUserContent = content;   // sentinel — cleared on sessionLoaded
  scrollBottom();

  post('sendMessage', { name: state.session.name, modelId, content });

  // Update local state so subsequent renderChat() calls include the message
  state.session.messages.push({ role: 'user', content, timestamp: new Date().toISOString() });
}

// ── Utilities ─────────────────────────────────────────────────────────────────

function post(type, payload) {
  vscode.postMessage({ type, ...payload });
}

function scrollBottom() {
  messages.scrollTop = messages.scrollHeight;
}

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('visible');
  setTimeout(hideError, 8000);
}
function hideError() {
  errorBanner.classList.remove('visible');
}

function autoResize() {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 150) + 'px';
}

// ── Event listeners ───────────────────────────────────────────────────────────

// Send
btnSend.addEventListener('click', sendMessage);
btnStop.addEventListener('click', () => post('stopGeneration', {}));

msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
msgInput.addEventListener('input', autoResize);

// Model change
modelSelect.addEventListener('change', () => {
  if (!state.session) return;
  const modelId = modelSelect.value;
  state.session.model = modelId;
  btnSend.disabled = !modelId;
  post('updateModel', { name: state.session.name, modelId });
});

// Header buttons
btnSysPrompt.addEventListener('click', () => {
  if (!state.session) return;
  const sys = state.session.messages.find((m) => m.role === 'system');
  $('sys-content').value = sys?.content || '';
  $('modal-sys').classList.add('open');
  $('sys-content').focus();
});

btnExport.addEventListener('click', () => {
  if (state.session) post('exportSession', { name: state.session.name });
});

btnClear.addEventListener('click', () => {
  if (!state.session) return;
  if (!confirm(`Clear all messages in "${state.session.name}"?`)) return;
  post('clearSession', { name: state.session.name });
});

btnDelSession.addEventListener('click', () => {
  if (!state.session) return;
  // VS Code webviews block confirm() — use a two-step arm/fire approach.
  if (!btnDelSession.dataset.confirming) {
    btnDelSession.dataset.confirming = '1';
    btnDelSession.textContent = 'delete?';
    btnDelSession.title = 'Click again to confirm deletion';
    btnDelSession.style.cssText += ';background:#a33;color:#fff;padding:0 6px';
    setTimeout(() => {
      delete btnDelSession.dataset.confirming;
      btnDelSession.textContent = '×';
      btnDelSession.title = 'Delete current session';
      btnDelSession.style.cssText = btnDelSession.style.cssText
        .replace(/;?background:[^;]+/, '').replace(/;?color:[^;]+/, '').replace(/;?padding:[^;]+/, '');
    }, 3000);
    return;
  }
  // Second click — confirmed.
  delete btnDelSession.dataset.confirming;
  btnDelSession.textContent = '×';
  btnDelSession.title = 'Delete current session';
  btnDelSession.style.cssText = btnDelSession.style.cssText
    .replace(/;?background:[^;]+/, '').replace(/;?color:[^;]+/, '').replace(/;?padding:[^;]+/, '');
  const name = state.session.name;
  clearActiveSession();
  post('deleteSession', { name });
});

btnCompact.addEventListener('click', () => {
  if (!state.session || state.streaming) return;
  const modelId = modelSelect.value || state.session.model;
  if (!modelId) { showError('Select a model before compacting.'); return; }
  post('compactNow', { name: state.session.name, modelId });
});

// Session dropdown change
sessionSelect.addEventListener('change', () => {
  const name = sessionSelect.value;
  if (name) {
    post('loadSession', { name });
  } else {
    clearActiveSession();
  }
});

// Refresh models
$('btn-refresh-models').addEventListener('click', () => post('refreshModels', {}));

// Agent-mode toggle
btnAgent.addEventListener('click', () => {
  if (!state.session) return;
  const agent = !(state.session.agent !== false);
  state.session.agent = agent;
  post('setAgentMode', { name: state.session.name, agent });
  renderAgentToggle();
  appendNotice(agent
    ? 'Agent mode on — the model can edit files in this workspace (you approve each change).'
    : 'Read-only mode — the model can inspect the workspace but not change it.');
});

// Context chips
$('chip-pick').addEventListener('click',      () => post('pickFile', {}));
$('chip-active').addEventListener('click',    () => insertIntoInput('@active '));
$('chip-selection').addEventListener('click', () => insertIntoInput('@selection '));
$('chip-problems').addEventListener('click',  () => insertIntoInput('@problems '));

// ── New session modal ─────────────────────────────────────────────────────────

$('btn-new').addEventListener('click', () => {
  $('new-name').value = '';
  $('new-agent').checked = state.capabilities.defaultAgent !== false;
  $('modal-new').classList.add('open');
  $('new-name').focus();
});

$('new-cancel').addEventListener('click', () => $('modal-new').classList.remove('open'));

$('new-create').addEventListener('click', () => {
  const name = $('new-name').value.trim();
  const modelId = $('new-model').value;
  if (!name) { $('new-name').focus(); return; }
  post('createSession', { name, modelId, agent: $('new-agent').checked });
  $('modal-new').classList.remove('open');
});

$('new-name').addEventListener('keydown', (e) => {
  if (e.key === 'Enter')  $('new-create').click();
  if (e.key === 'Escape') $('new-cancel').click();
});

// ── System prompt modal ───────────────────────────────────────────────────────

$('sys-cancel').addEventListener('click', () => $('modal-sys').classList.remove('open'));

$('sys-save').addEventListener('click', () => {
  if (!state.session) return;
  const content = $('sys-content').value;
  post('setSystemPrompt', { name: state.session.name, content });
  $('modal-sys').classList.remove('open');
});

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach((overlay) => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// Close modals on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.open').forEach((o) => o.classList.remove('open'));
  }
});
</script>
</body>
</html>
